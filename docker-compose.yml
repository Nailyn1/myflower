services:
  backend:
    build:
      context: .
      dockerfile: ./apps/backend/Dockerfile
      target: dev
    container_name: myflower_backend
    env_file:
      - ./apps/backend/.env
    ports:
      - "5000:5000"
    volumes:
      - ./apps/backend:/workspace/apps/backend:delegated
      - ./packages/shared:/workspace/packages/shared:delegated
      - /workspace/apps/backend/node_modules
      - /workspace/packages/shared/node_modules
      - pnpm-store:/root/.pnpm-store
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - WATCH_INTERVAL=1000
    init: true
    tty: true
    depends_on:
      - db

  db:
    image: postgres:15
    container_name: myflower_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: myflowers
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  pgdata:
  pnpm-store:
